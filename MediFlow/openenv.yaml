name: MediFlow
display_name: "Hospital Resource Management"
description: >
  RL environment simulating hospital triage and resource scheduling.
  An agent must assign patients to doctors, allocate beds, manage surgeons,
  and handle medicine inventory under stochastic patient arrivals.
version: "1.0.0"
author: "AI-see-U"
tags:
  - healthcare
  - scheduling
  - resource-management
  - simulation
tasks:
  - id: easy
    description: "Easy: 6 doctors, 3 surgeons, 15 beds, low arrival rate (λ=1.5), 24 steps"
  - id: medium
    description: "Medium: 5 doctors, 2 surgeons, 10 beds, moderate arrival (λ=2.5), 48 steps"
  - id: hard
    description: "Hard: 4 doctors, 1 surgeon, 8 beds, extreme arrival (λ=4.0), 48 steps"
